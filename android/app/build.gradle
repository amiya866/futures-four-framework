plugins { id 'com.android.application' }

android {
    namespace 'xyz.abysstrades.app'
    compileSdk 34
    defaultConfig {
        applicationId "xyz.abysstrades.app"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "keystore.jks")
            storePassword System.getenv("KEYSTORE_PASS") ?: "yuanxing888"
            keyAlias "yuanxing"
            keyPassword System.getenv("KEYSTORE_PASS") ?: "yuanxing888"
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}

name: Refresh futures snapshots and deploy Pages

on:
  workflow_dispatch:
  schedule:
    # 2026-08-18 用户定稿: 价格15分钟 + 策略盘中30分钟同步重算 + 有色夜盘21:25北京加刷 + 全量每天16:30北京
    - cron: "*/15 0-7,13-15 * * 1-5"
    - cron: "2,32 1-3,5-6,13-15 * * 1-5"
    - cron: "25 13 * * 1-5"
    - cron: "30 8 * * *"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical research registry
        run: python scripts/validate_research_registry.py
      - name: Build 77-product snapshots
        if: github.event_name != 'schedule' || github.event.schedule == '30 8 * * *'
        env:
          ZHIJI_GUAN_KEY: ${{ secrets.ZHIJI_GUAN_KEY }}
        run: python scripts/build_all.py --workers 8

      - name: Recompute intraday strategies (30min + 21:25有色夜盘)
        if: github.event_name == 'schedule' && (github.event.schedule == '2,32 1-3,5-6,13-15 * * 1-5' || github.event.schedule == '25 13 * * 1-5')
        env:
          ZHIJI_GUAN_KEY: ${{ secrets.ZHIJI_GUAN_KEY }}
        run: python scripts/build_all.py --workers 8 --skip-fundamentals

      - name: Refresh live quotes
        if: github.event_name == 'schedule' && github.event.schedule == '*/15 0-7,13-15 * * 1-5'
        env:
          ZHIJI_GUAN_KEY: ${{ secrets.ZHIJI_GUAN_KEY }}
        run: python scripts/refresh_quotes.py
      - name: Build A-share stocks snapshot
        if: github.event_name != 'schedule' || github.event.schedule == '30 8 * * *'
        continue-on-error: true
        run: python scripts/build_stocks.py
      - name: Verify static output
        run: python scripts/verify_site.py
      - name: Commit rebuilt data snapshots back to repo
        if: github.event_name != 'schedule' || github.event.schedule == '30 8 * * *'
        continue-on-error: true
        run: |
          git config user.name "ff-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "data: 全量重建快照回写 [skip ci]"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

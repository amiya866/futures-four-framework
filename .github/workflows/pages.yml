name: Refresh futures snapshots and deploy Pages

on:
  workflow_dispatch:
  repository_dispatch:
    types: [ff-sync]
  schedule:
    # 2026-08-18 终稿(用户规则: 策略必须和价格同步):
    # 日盘9:00-15:30北京(01-07UTC)每15分钟 价格+策略一起重算; 夜盘21-23点价格15分钟+21:25策略加刷; 16:30全量
    - cron: "*/15 1-7 * * 1-5"
    - cron: "*/15 13-15 * * 1-5"
    - cron: "25 13 * * 1-5"
    - cron: "30 8 * * *"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical research registry
        run: python scripts/validate_research_registry.py
      - name: Build 77-product snapshots
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '30 8 * * *') && !contains(github.event.head_commit.message, '[data-only]')
        env:
          ZHIJI_GUAN_KEY: ${{ secrets.ZHIJI_GUAN_KEY }}
        run: python scripts/build_all.py --workers 8

      - name: Price+Strategy sync rebuild (day session 15min; 21:25 nonferrous)
        if: github.event_name == 'repository_dispatch' || (github.event_name == 'schedule' && (github.event.schedule == '*/15 1-7 * * 1-5' || github.event.schedule == '25 13 * * 1-5'))
        env:
          ZHIJI_GUAN_KEY: ${{ secrets.ZHIJI_GUAN_KEY }}
        run: python scripts/build_all.py --workers 8 --skip-fundamentals

      - name: Refresh live quotes (night session 15min)
        if: github.event_name == 'schedule' && github.event.schedule == '*/15 13-15 * * 1-5'
        env:
          ZHIJI_GUAN_KEY: ${{ secrets.ZHIJI_GUAN_KEY }}
        run: python scripts/refresh_quotes.py
      - name: Materialize site only (data-only fast path)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[data-only]')
        run: python -c "import sys; sys.path.insert(0, 'scripts'); from build_all import materialize_site; materialize_site()"
      - name: Update A-share stocks (sina fast, 15min 日盘; 电脑关也由 Actions 兜底)
        # sina 直连快更 ~10s；本地 _ff_sync15.py 与 Actions 双通道，关机后台也自动
        if: github.event_name == 'repository_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '*/15 1-7 * * 1-5') || github.event_name == 'workflow_dispatch' || github.event.schedule == '30 8 * * *'
        continue-on-error: true
        run: python scripts/update_stocks_sina.py
      - name: Build equity linkage (股商联动热力图, 15min 日盘; 关机也由 Actions)
        if: github.event_name == 'repository_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '*/15 1-7 * * 1-5') || github.event_name == 'workflow_dispatch' || github.event.schedule == '30 8 * * *'
        continue-on-error: true
        run: python scripts/build_equity.py
      - name: Re-materialize after stocks (stocks 晚于主 materialize, 需重物化才进 _site)
        if: github.event_name == 'repository_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '*/15 1-7 * * 1-5') || github.event_name == 'workflow_dispatch' || github.event.schedule == '30 8 * * *'
        run: python -c "import sys; sys.path.insert(0, 'scripts'); from build_all import materialize_site; materialize_site()"
      - name: Build A-share stocks snapshot (full, 08:30/手动补市值PE K线)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 8 * * *'
        continue-on-error: true
        run: python scripts/build_stocks.py
      - name: Verify static output
        run: python scripts/verify_site.py
      - name: Commit rebuilt data snapshots back to repo
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '30 8 * * *') && !contains(github.event.head_commit.message, '[data-only]')
        continue-on-error: true
        run: |
          git config user.name "ff-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "data: 全量重建快照回写 [skip ci]"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Site healthcheck
# 自我保护：每日监控线上渊行站数据新鲜度，异常则建 issue 告警（2026-08-20 建）
on:
  schedule:
    # 北京 09:30 / 16:30（开盘前+收盘后各一次）
    - cron: "30 1,8 * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: healthcheck
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check live site data freshness
        run: |
          python - <<'PY'
          import json, urllib.request, datetime
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "healthcheck/1.0"})
              with urllib.request.urlopen(req, timeout=25) as r:
                  return json.loads(r.read().decode("utf-8"))
          try:
              m = get("https://abysstrades.xyz/data/market.json")
          except Exception as e:
              print(f"HEALTHCHECK FAIL: market.json 拉取失败: {e}")
              raise SystemExit(1)
          fresh = int(m.get("fresh") or 0); stale = int(m.get("stale") or 0)
          total = fresh + stale
          updated = m.get("updated_at", "")
          print(f"market: fresh={fresh}/{total} stale={stale} updated={updated}")
          if total and fresh / total < 0.5:
              print("HEALTHCHECK FAIL: 行情新鲜度 <50%")
              raise SystemExit(1)
          # 更新超过 48h → 预警
          if updated:
              try:
                  ts = updated.replace("Z", "+00:00")
                  dt = datetime.datetime.fromisoformat(ts)
                  age = (datetime.datetime.now(dt.tzinfo) - dt).total_seconds()
                  if age > 48 * 3600:
                      print(f"HEALTHCHECK FAIL: 数据 {age/3600:.1f}h 未更新")
                      raise SystemExit(1)
              except Exception:
                  pass
          # 股票
          try:
              s = get("https://abysstrades.xyz/data/stocks/quotes.json")
              print(f"stocks updated: {s.get('updated_at')}")
          except Exception as e:
              print(f"HEALTHCHECK WARN: stocks 拉取失败: {e}")
          print("HEALTHCHECK OK")
          PY
      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "⚠️ 渊行站数据异常（健康检查）",
              body: "健康检查发现站点数据可能过期或不新鲜，请人工核查。\n\n运行详情: " + context.serverUrl + "/" + context.repo.full_name + "/actions/runs/" + context.runId,
            })

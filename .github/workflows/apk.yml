name: Build Android APK (TWA, gradle direct)

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Keystore(无secret则生成)
        run: |
          cd android/app
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > keystore.jks
          else
            keytool -genkeypair -v -keystore keystore.jks -alias yuanxing \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" \
              -dname "CN=Yuanxing, OU=Research, O=YAFCO, L=Hangzhou, ST=Zhejiang, C=CN"
          fi
          keytool -list -v -keystore keystore.jks -storepass "$KEYSTORE_PASS" -alias yuanxing | grep "SHA256:" | head -1
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      - name: Build APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.9
          cd app
          KEYSTORE_FILE=keystore.jks ../gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      - uses: actions/upload-artifact@v4
        with:
          name: yuanxing-apk
          path: |
            android/app/build/outputs/**/*.apk
            android/app/keystore.jks
